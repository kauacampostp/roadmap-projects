<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Random Repository</title>
  <link rel="stylesheet" href="./style.css"></link>
</head>

<body>
  <main>
    <h3 class="state" id="state"></h3>

    <h1 class="title">GitHub Repository Finder</h1>
    <div class="dropdown-container" id="dropdownContainer">
      <button class="dropdown-btn" id="dropdownBtn"></button>

      <ul class="dropdown-list" id="dropdownList">
        <li data-value="JavaScript">JavaScript</li>
        <li data-value="Python">Python</li>
        <li data-value="C++">C++</li>
        <li data-value="React">React</li>
      </ul>
    </div>

    <div></div>

    <section class="repo-card" id="repoCard">
      <p class="text-card" id="textCard"></p>
      <h3><a class="repo-card__name" id="repoName" href="#" target="_blank" rel="noopener noreferrer"></a></h3>
      <p class="repo-card__description" id="repoDescription"></p>
      <div class="repo-card__status" id="repoStatus">
        <span class="repo-card__language" id="repoLanguage"></span>
        <span class="repo-card__star" id="repoStargazers_count"></span>
        <span class="repo-card__fork" id="repoForks_count"></span>
      </div>
    </section>

    <section class="aux-btn hidden" id="auxBtn">
      <p id="auxBtnText"></p>
    </section>
  </main>


  <script src="./js/ui.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/app.js"></script>
</body>

</html>
